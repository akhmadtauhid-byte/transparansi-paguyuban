<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transparansi Paguyuban</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta name="description" content="Laporan kas, pengadaan, dan penggunaan anggaran Paguyuban Warga secara terbuka.">
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1; --surface: #fcfcfb; --surface-2: #f0efec;
  --text: #0b0b0b; --text-2: #52514e; --muted: #77766f;
  --line: #e3e2dc; --line-2: #d3d2ca;
  --accent: #2a78d6; --accent-ink: #ffffff; --accent-soft: #e3effc;
  --s1: #2a78d6; --s2: #eb6834; --track: #cde2fb;
  --good: #0ca30c; --good-ink: #006300; --good-bg: #e6f5e6;
  --warn: #fab219; --warn-ink: #7a5200; --warn-bg: #fff3d6;
  --serious: #ec835a; --crit: #d03b3b; --crit-ink: #a12525; --crit-bg: #fbe7e7;
  --info-bg: #e3effc; --info-ink: #184f95;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232322;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #99988f;
    --line: #333331; --line-2: #464643;
    --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: #14283f;
    --s1: #3987e5; --s2: #d95926; --track: #0d366b;
    --good-ink: #5fd35f; --good-bg: #12301a;
    --warn-ink: #f6c453; --warn-bg: #3a2c0a;
    --crit-ink: #ff8f8f; --crit-bg: #3d1616;
    --info-bg: #14283f; --info-ink: #8fbcf3;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.25; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.hide { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .t2 { color: var(--text-2); }
.right { text-align: right; } .center { text-align: center; }
.small { font-size: 13px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 860px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .g2, .g4 { grid-template-columns: 1fr; } }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand { font-weight: 700; font-size: 16px; text-decoration: none; color: var(--text); display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.brand span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .acts { margin-left: auto; display: flex; gap: 8px; flex: none; }
.btn { appearance: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; line-height: 1.2; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.ok { background: var(--good-bg); border-color: var(--good); color: var(--good-ink); }
.btn.bad { background: var(--crit-bg); border-color: var(--crit); color: var(--crit-ink); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.loadbar { position: fixed; left: 0; top: 0; height: 3px; width: 0; background: var(--accent); z-index: 100; transition: width .3s; }
.loadbar.on { width: 70%; transition: width 6s cubic-bezier(.1,.6,.3,1); }

/* tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 14px 0 18px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 10px 14px; cursor: pointer; border: 0; background: none; font-weight: 600; color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
.card h2 { font-size: 16px; margin-bottom: 4px; } .card h3 { font-size: 14px; }
.card .sub { color: var(--text-2); font-size: 13px; margin-bottom: 12px; }
.sec { margin: 22px 0 10px; font-size: 18px; }
.hero { padding: 22px 0 6px; }
.hero h1 { font-size: 24px; } .hero p { margin: 4px 0 0; color: var(--text-2); }
.stat .lbl { font-size: 13px; color: var(--text-2); }
.stat .val { font-size: 26px; font-weight: 650; letter-spacing: -.01em; margin-top: 2px; }
.stat .val.hero-fig { font-size: 48px; line-height: 1.1; }
.stat .note { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* table */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--text-2); background: var(--surface-2); padding: 9px 12px; white-space: nowrap; border-bottom: 1px solid var(--line); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; } td.c, th.c { text-align: center; }
td.nw { white-space: nowrap; }
tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
tfoot td { font-weight: 650; background: var(--surface-2); }
.empty { padding: 26px; text-align: center; color: var(--muted); }
.sk { display: grid; gap: 12px; padding: 4px 0; }
.sk i { display: block; height: 16px; border-radius: 8px; background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 45%, var(--surface-2) 65%); background-size: 300% 100%; animation: skm 1.2s linear infinite; }
.sk i.t { height: 26px; width: 42%; } .sk i.b { height: 84px; border-radius: 12px; } .sk i.w { width: 70%; }
@keyframes skm { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .sk i { animation: none; } }

/* chips & meters */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good-ink); } .chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
.chip.bad { background: var(--crit-bg); color: var(--crit-ink); } .chip.info { background: var(--info-bg); color: var(--info-ink); }
.meter { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; min-width: 80px; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter.warn > i { background: var(--warn); } .meter.bad > i { background: var(--crit); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-2); margin: 4px 0 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* chart */
.chartbox { position: relative; }
.chartbox svg { width: 100%; height: auto; display: block; }
.chartbox .gl { stroke: var(--line); stroke-width: 1; }
.chartbox text { fill: var(--muted); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 11px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.16); z-index: 5; min-width: 150px; }
.tip b { display: block; margin-bottom: 3px; }
.tip div { display: flex; justify-content: space-between; gap: 14px; }

/* forms */
label.f { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
label.f small { font-weight: 400; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=password], input[type=tel], input[type=month], select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); }
textarea { min-height: 84px; resize: vertical; }
.chk { display: flex; gap: 8px; align-items: center; margin: 6px 0; font-size: 14px; }
.chk input { width: 18px; height: 18px; }
.help { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.err { color: var(--crit-ink); font-size: 13.5px; margin-top: 10px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: end; }
.filters > div { min-width: 140px; } .filters label.f { margin-top: 0; }

/* modal & toast */
.ov { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow-y: auto; }
.mdl { background: var(--surface); border-radius: 16px; width: 100%; max-width: 560px; box-shadow: 0 20px 60px rgba(0,0,0,.35); border: 1px solid var(--line); }
.mdl.wide { max-width: 860px; }
.mdl header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.mdl header h2 { font-size: 17px; flex: 1; }
.mdl .bd { padding: 6px 20px 18px; }
.mdl footer { padding: 12px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--text-2); padding: 2px 8px; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; width: calc(100% - 24px); max-width: 520px; }
.toast { padding: 11px 16px; border-radius: 11px; font-size: 14px; background: var(--text); color: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast.bad { background: var(--crit); color: #fff; } .toast.good { background: #0b7a0b; color: #fff; }

/* notices */
.note { border-radius: 12px; padding: 11px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.note.info { background: var(--info-bg); color: var(--info-ink); } .note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.note.bad { background: var(--crit-bg); color: var(--crit-ink); } .note.good { background: var(--good-bg); color: var(--good-ink); }
.stack > * + * { margin-top: 10px; }

/* pengadaan chain */
.chain { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.step { font-size: 12.5px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--text-2); }
.step.done { background: var(--good-bg); border-color: transparent; color: var(--good-ink); font-weight: 600; }
.step.no { background: var(--crit-bg); border-color: transparent; color: var(--crit-ink); font-weight: 600; }
.pg { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); }
.pg + .pg { margin-top: 10px; }
.pg h3 { font-size: 15px; }

/* staff layout */
.staff { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; margin-top: 16px; align-items: start; }
.side { position: sticky; top: 72px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
.side a { display: flex; justify-content: space-between; align-items: center; padding: 9px 11px; border-radius: 9px; color: var(--text); text-decoration: none; font-weight: 550; font-size: 14px; }
.side a:hover { background: var(--surface-2); } .side a.on { background: var(--accent-soft); color: var(--accent); }
.side .badge { background: var(--crit); color: #fff; border-radius: 99px; font-size: 11.5px; padding: 1px 7px; }
@media (max-width: 860px) {
  .staff { grid-template-columns: 1fr; }
  .side { position: static; display: flex; overflow-x: auto; gap: 2px; padding: 6px; }
  .side a { white-space: nowrap; }
}
.loginbox { max-width: 400px; margin: 34px auto; }
.foot { margin: 40px 0 30px; font-size: 13px; color: var(--muted); text-align: center; }
.kartu { border: 1px dashed var(--line-2); border-radius: 10px; padding: 10px 12px; }
@media print {
  body { background: #fff; color: #000; } .top, .tabs, .btn, .foot, #toast, .no-print, .side { display: none !important; }
  .ov { position: static; background: none; padding: 0; } .mdl { box-shadow: none; border: 0; max-width: none; } .mdl footer, .x { display: none; }
  .card, .tbl-wrap { box-shadow: none; }
}
</style>
</head>
<body>
<div class="loadbar" id="loadbar"></div>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" id="brand"><div class="logo">P</div><span class="t" id="brandName">Transparansi Paguyuban</span></a>
    <div class="acts" id="acts"></div>
  </div>
</header>
<main class="wrap" id="app"><div class="empty">Memuat...</div></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
/* ================================================================
   SIKAS-PAGUYUBAN - Frontend (GitHub Pages)
   PENTING SETIAP KALI FILE INI DIGANTI TOTAL:
   pulihkan API_URL di bawah dengan URL Web App Apps Script Anda
   (berakhiran /exec).
   ================================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzRak9TruSnBDeggjhB3cKO-dH4KpA-0X91ReD2OvqdA4lj0TZ0EScFmXpzWFxnzytXMQ/exec';

/* ---------- util ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (v) => String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = (n) => 'Rp' + Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const rpS = (n) => { n = Number(n) || 0; const a = Math.abs(n); if (a >= 1e9) return (n / 1e9).toFixed(1).replace('.', ',') + ' M'; if (a >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' jt'; if (a >= 1e3) return Math.round(n / 1e3) + ' rb'; return String(n); };
const BLN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN3 = BLN.map((b) => b.slice(0, 3));
const tglID = (d) => { if (!d) return '-'; const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? Number(m[3]) + ' ' + BLN3[Number(m[2]) - 1] + ' ' + m[1] : d; };
const blnID = (p) => { const m = String(p || '').match(/^(\d{4})-(\d{2})/); return m ? BLN[Number(m[2]) - 1] + ' ' + m[1] : p; };
const pct = (a, b) => (b > 0 ? Math.round(a / b * 1000) / 10 : 0);
const POS_NAMA = {};
const STATUS_CHIP = { 'Lunas': 'good', 'Diterima': 'good', 'Disetujui': 'good', 'Selesai': 'good', 'Disalurkan': 'good', 'Terverifikasi': 'good', 'Menunggak': 'bad', 'Ditolak': 'bad', 'Perlu Perbaikan': 'bad', 'Dibatalkan': 'bad', 'Sebagian': 'warn', 'Menunggu': 'warn', 'Menunggu Persetujuan': 'warn', 'Dikirim': 'info', 'Terjadwal': 'info', 'Diajukan': 'info', 'Belum bayar': '', 'Belum ada': 'warn' };
const ICON = { good: '✓', bad: '✕', warn: '!', info: 'i', '': '' };
const chip = (s) => { const k = STATUS_CHIP[s] === undefined ? '' : STATUS_CHIP[s]; return '<span class="chip ' + k + '">' + (ICON[k] ? '<span aria-hidden="true">' + ICON[k] + '</span>' : '') + esc(s) + '</span>'; };
const linkNota = (u) => (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">Lihat nota</a>' : '<span class="muted">-</span>');
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };

/* ---------- sesi ---------- */
let SESI = null;
try { SESI = JSON.parse(sessionStorage.getItem('sikas_sesi') || 'null'); } catch (e) { SESI = null; }
const simpanSesi = (s) => { SESI = s; try { if (s) sessionStorage.setItem('sikas_sesi', JSON.stringify(s)); else sessionStorage.removeItem('sikas_sesi'); } catch (e) { /* abaikan */ } };

/* ---------- API ---------- */
let loading = 0;
function loadBar(on) { const b = $('#loadbar'); loading += on ? 1 : -1; if (loading > 0) b.classList.add('on'); else { b.classList.remove('on'); b.style.width = '100%'; setTimeout(() => { b.style.width = '0'; }, 250); } }
/* ================================================================
   TURBO - cache baca (stale-while-revalidate), batch & prefetch
   ================================================================ */
const READ = new Set(['publicData', 'laporanDetail', 'kkSaya', 'dashboardStaf', 'kkList', 'userList', 'tagihanStatus', 'tunggakanList', 'bayarList', 'konfirmasiList', 'rapbList', 'posList', 'pengadaanList', 'keluarList', 'pendapatanLainList', 'danaRTList', 'lpjList', 'pengumumanList', 'laporanPratinjau', 'pengaturanGet', 'auditList']);
const FRESH_MS = 20000, STALE_MS = 15 * 60000, PUB_STALE_MS = 24 * 3600000;
const CACHE = new Map(), INFLIGHT = new Map();
let EPOCH = 0, PUB_KEY = '';
const skeleton = () => '<div class="sk" role="status" aria-label="Memuat"><i class="t"></i><i class="b"></i><i></i><i class="w"></i><i class="b"></i></div>';
const umum = (a) => a === 'publicData' || a === 'laporanDetail';
const uid = () => (SESI && SESI.profil ? SESI.profil.tipe + ':' + SESI.profil.id : '-');
const ckey = (a, d) => a + '|' + (umum(a) ? '' : uid() + '|') + JSON.stringify(d || {});
// data publik disimpan di perangkat agar kunjungan berikutnya tampil seketika (hanya data publik, tidak pernah data pengurus/warga)
const LS_PUB = 'sikas_pub_v2';
try { const x = JSON.parse(localStorage.getItem(LS_PUB) || 'null'); if (x && x.k && x.j && Date.now() - x.t < PUB_STALE_MS) CACHE.set(x.k, { t: x.t, j: x.j }); } catch (e) { /* abaikan */ }
function simpanPub(k, j) { if (k !== 'publicData|{}') return; try { localStorage.setItem(LS_PUB, JSON.stringify({ k: k, t: Date.now(), j: j })); } catch (e) { /* abaikan */ } }
function bersihkanCache(termasukPublik) {
  EPOCH++;
  Array.from(CACHE.keys()).forEach((k) => { if (termasukPublik || !umum(k.split('|')[0])) CACHE.delete(k); });
  if (termasukPublik) { try { localStorage.removeItem(LS_PUB); } catch (e) { /* abaikan */ } }
}
async function post(body, silent) {
  if (API_URL.indexOf('GANTI_') === 0) throw new Error('API_URL belum diatur di index.html. Isi dengan URL Web App Apps Script.');
  body.token = SESI ? SESI.token : undefined;
  if (!silent) loadBar(true);
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' });
    if (!res.ok) throw new Error('Server tidak merespons (' + res.status + ').');
    const j = await res.json();
    if (!j.ok) { const e = new Error(j.error || 'Terjadi kesalahan.'); e.kode = j.kode; if (j.kode === 'AUTH' && !silent) { simpanSesi(null); bersihkanCache(false); renderAkun(); setTimeout(route, 30); } throw e; }
    return j.data;
  } catch (e) {
    if (e instanceof TypeError) throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet Anda.');
    throw e;
  } finally { if (!silent) loadBar(false); }
}
function ambilRead(action, data, k, silent) {
  if (INFLIGHT.has(k)) return INFLIGHT.get(k);
  const ep = EPOCH;
  const p = post(Object.assign({}, data || {}, { action: action }), silent).then((v) => {
    const j = JSON.stringify(v);
    if (ep === EPOCH) { CACHE.set(k, { t: Date.now(), j: j }); simpanPub(k, j); }
    return j;
  }).finally(() => { INFLIGHT.delete(k); });
  INFLIGHT.set(k, p);
  return p;
}
function segarkanLatar(action, data, k, lama) {
  if (INFLIGHT.has(k)) return;
  const hash = location.hash;
  ambilRead(action, data, k, true).then((j) => {
    if (j === lama.j) return;
    if (action === 'dashboardStaf') { try { DASH = JSON.parse(j); badges(); } catch (e) { /* abaikan */ } if (!/^#\/staf(\/beranda)?$/.test(hash)) return; }

/* ---------- pengadaan ---------- */
let PG_ST = '';
function pengadaanKartu(p, ctx) {
  const me = SESI.profil, role = me.role;
  const termurah = p.penawaran.length ? Math.min.apply(null, p.penawaran.map((w) => w.harga)) : 0;
  const bisaKelola = p.pemohon === me.id || role === 'bendahara' || role === 'admin';
  const sudah = p.persetujuan.map((x) => x.peran);
  const btn = [];
  if (p.status === 'Diajukan' && bisaKelola && PEMOHON.indexOf(role) >= 0) { btn.push('<button class="btn sm" data-a="tawar" data-id="' + p.id_pengadaan + '">Tambah penawaran</button>', '<button class="btn sm pri" data-a="kirim" data-id="' + p.id_pengadaan + '">Kirim untuk persetujuan</button>'); }
  if (p.status === 'Menunggu Persetujuan' && p.perlu.indexOf(role) >= 0 && sudah.indexOf(role) < 0 && p.pemohon !== me.id) btn.push('<button class="btn sm ok" data-a="setuju" data-id="' + p.id_pengadaan + '">Setujui</button>', '<button class="btn sm bad" data-a="tolak" data-id="' + p.id_pengadaan + '">Tolak</button>');
  if (p.status === 'Disetujui' && role === 'bendahara') btn.push('<button class="btn sm pri" data-a="beli" data-id="' + p.id_pengadaan + '">Catat pembelian & unggah nota</button>');
  if (['Diajukan', 'Menunggu Persetujuan', 'Disetujui'].indexOf(p.status) >= 0 && bisaKelola && PEMOHON.indexOf(role) >= 0) btn.push('<button class="btn sm" data-a="batal" data-id="' + p.id_pengadaan + '">Batalkan</button>');
  const rantai = '<div class="chain">' + p.perlu.map((r) => { const a = p.persetujuan.filter((x) => x.peran === r)[0]; if (!a) return '<span class="step">' + esc(PERAN[r]) + ': menunggu</span>'; return a.keputusan === 'Setuju' ? '<span class="step done"><span aria-hidden="true">✓</span> ' + esc(PERAN[r]) + ' (' + esc(a.nama) + ')</span>' : '<span class="step no"><span aria-hidden="true">✕</span> ' + esc(PERAN[r]) + ' menolak: ' + esc(a.catatan) + '</span>'; }).join('') + '</div>';
  return '<div class="pg"><div class="row"><h3 class="grow">' + esc(p.uraian) + '</h3>' + chip(p.status) + '</div>' +

  const form = (a) => [{ name: 'judul', label: 'Judul', value: a.judul || '', required: true, max: 120 }, { name: 'kategori', label: 'Kategori', type: 'select', options: KAT, value: a.kategori || 'Umum' }, { name: 'isi', label: 'Isi pengumuman', type: 'textarea', value: a.isi || '', max: 1500, required: true }, { name: 'tanggal', label: 'Tanggal', type: 'date', value: a.tanggal || hariIniLokal() }, { name: 'tampil_sampai', label: 'Tampilkan sampai', hint: '(opsional)', type: 'date', value: a.tampil_sampai || '' }, { name: 'tautan', label: 'Tautan', hint: '(opsional, diawali https://)', value: a.tautan || '', max: 300 }, { name: 'sematkan', label: 'Sematkan di halaman utama', type: 'checkbox', value: a.sematkan === 'Ya' }];
  root.innerHTML = judul('Pengumuman', 'Tampil di halaman publik dan portal warga. Tidak ada pesan otomatis; warga membaca pengumuman di halaman ini.', edit ? '<button class="btn pri" id="anBaru">Buat pengumuman</button>' : '') +
    tableHTML([{ h: 'Tanggal', cls: 'nw', f: (r) => tglID(r.tanggal) }, { h: 'Kategori', f: (r) => '<span class="chip ' + (r.kategori === 'Darurat' ? 'bad' : 'info') + '">' + esc(r.kategori) + '</span>' }, { h: 'Judul', f: (r) => esc(r.judul) + (r.sematkan === 'Ya' ? ' <span class="chip">Disematkan</span>' : '') }, { h: 'Sampai', cls: 'nw', f: (r) => tglID(r.tampil_sampai) }, { h: '', f: (r) => (edit ? '<div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-ub="' + r.id + '">Ubah</button><button class="btn sm bad" data-hp="' + r.id + '">Hapus</button></div>' : '') }], l, { empty: 'Belum ada pengumuman.' });
  const bar = $('#anBaru', root);
  if (bar) bar.onclick = () => formModal({ title: 'Buat pengumuman', wide: true, fields: form({}), onSubmit: async (v) => { await api('pengumumanSimpan', { data: v }); PUB = null; toast('Pengumuman diterbitkan.', 'good'); V.pengumuman(root); } });
  $$('[data-ub]', root).forEach((b) => { b.onclick = () => { const a = l.filter((x) => x.id === b.getAttribute('data-ub'))[0]; formModal({ title: 'Ubah pengumuman', wide: true, fields: form(a), onSubmit: async (v) => { await api('pengumumanSimpan', { data: Object.assign({ id: a.id }, v) }); PUB = null; toast('Disimpan.', 'good'); V.pengumuman(root); } }); }; });
  $$('[data-hp]', root).forEach((b) => { b.onclick = async () => { if (await konfirmasi('Hapus pengumuman', 'Hapus pengumuman ini dari halaman publik?', 'Hapus', 'bad')) { if (await coba(() => api('pengumumanHapus', { id: b.getAttribute('data-hp') }), 'Dihapus.')) { PUB = null; V.pengumuman(root); } } }; });
};

let LP_PER = '';
V.laporan = async (root) => {
  if (!LP_PER) { const t = hariIniLokal(), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7)); LP_PER = m === 1 ? (y - 1) + '-12' : y + '-' + ('0' + (m - 1)).slice(-2); }
  if (!PUB) { try { await muatPublik(); } catch (e) { /* nama pos jatuh ke kode */ } }
  const d = await api('laporanPratinjau', { periode: LP_PER }), sn = d.snapshot;
  root.innerHTML = judul('Laporan bulanan', 'Pratinjau dihitung dari data terkini. Setelah diterbitkan, laporan tampil di halaman publik dan menjadi arsip.') +
    '<div class="filters"><div><label class="f" for="lpPer">Bulan laporan</label><input type="month" id="lpPer" value="' + LP_PER + '"></div><div>' + (d.terbit ? '<span class="chip good"><span aria-hidden="true">✓</span>Sudah terbit</span>' : '<span class="chip warn"><span aria-hidden="true">!</span>Belum terbit</span>') + '</div>' +
    '<div class="row" style="gap:8px"><button class="btn" id="lpWa">Salin teks WhatsApp</button><button class="btn" id="lpCetak">Cetak</button>' + (R('bendahara', 'ketua') ? '<button class="btn pri" id="lpTerbit">' + (d.terbit ? 'Terbitkan ulang' : 'Terbitkan laporan') + '</button>' : '') + '</div></div>' +
    '<div class="card">' + laporanBody({ data: sn, catatan: '' }) + '</div>';
  $('#lpPer', root).onchange = (e) => { if (e.target.value) { LP_PER = e.target.value; V.laporan(root); } };
  $('#lpWa', root).onclick = () => salinTeks(d.teks_wa);
  $('#lpCetak', root).onclick = cetak;
  const t = $('#lpTerbit', root);
  if (t) t.onclick = () => formModal({ title: 'Terbitkan laporan ' + blnID(LP_PER), intro: 'Laporan akan tampil untuk seluruh warga di halaman publik, dan pengumuman otomatis dibuat.', fields: [{ name: 'catatan', label: 'Catatan Bendahara', hint: '(opsional)', type: 'textarea', max: 300 }], submit: 'Terbitkan', onSubmit: async (v) => { await api('laporanTerbit', { periode: LP_PER, catatan: v.catatan }); PUB = null; toast('Laporan diterbitkan.', 'good'); DASHT = 0; V.laporan(root); } });
};

V.pemeriksaan = async (root) => {
  const p = await api('publicData', {}), th = new Date().getFullYear();
  const tw = []; for (let y = th; y >= th - 1; y--) for (let q = 4; q >= 1; q--) tw.push(y + '-T' + q);
  root.innerHTML = judul('Pemeriksaan Dewan Pengawas', 'Hasil pemeriksaan tampil di halaman publik.', '<button class="btn pri" id="pkBaru">Catat hasil pemeriksaan</button>') +
    tableHTML([{ h: 'Periode', k: 'periode' }, { h: 'Tanggal', cls: 'nw', f: (r) => tglID(r.tanggal) }, { h: 'Pemeriksa', k: 'dewas' }, { h: 'Opini', f: (r) => chip(r.opini) }, { h: 'Catatan', k: 'catatan' }], p.pemeriksaan, { empty: 'Belum ada pemeriksaan.' });
  $('#pkBaru', root).onclick = () => formModal({ title: 'Catat hasil pemeriksaan', fields: [{ name: 'periode', label: 'Periode diperiksa', type: 'select', options: tw }, { name: 'opini', label: 'Opini', type: 'select', options: ['Wajar', 'Wajar dengan catatan', 'Perlu perbaikan'] }, { name: 'catatan', label: 'Catatan dan temuan', type: 'textarea', max: 800, required: true }], onSubmit: async (v) => { await api('periksaSimpan', { data: v }); PUB = null; toast('Hasil pemeriksaan dicatat.', 'good'); V.pemeriksaan(root); } });
};

function pinPenggunaModal(username, pin, judulM) {
  openModal({ title: judulM, body: '<div class="note warn" style="margin:12px 0"><span aria-hidden="true">!</span><div>PIN hanya ditampilkan sekali. Sampaikan langsung kepada yang bersangkutan; wajib diganti saat masuk pertama.</div></div><div class="kartu">Nama pengguna: <b>' + esc(username) + '</b><br>PIN sementara: <b class="num" style="font-size:20px;letter-spacing:.1em">' + esc(pin) + '</b></div>', actions: [{ label: 'Selesai', kind: 'pri', onClick: () => true }] });
}
V.pengguna = async (root) => {
  const l = await api('userList', {});
  const form = (u) => [{ name: 'username', label: 'Nama pengguna', value: u.username || '', required: true, max: 30, help: 'Huruf kecil, angka, titik, garis bawah. Contoh: bendahara1', autocomplete: 'off' }, { name: 'nama', label: 'Nama lengkap', value: u.nama || '', required: true, max: 80 }, { name: 'role', label: 'Peran', type: 'select', options: Object.keys(PERAN).map((k) => ({ v: k, l: PERAN[k] })), value: u.role || 'bendahara' }, { name: 'jabatan', label: 'Jabatan', hint: '(opsional)', value: u.jabatan || '', max: 60 }, { name: 'rt', label: 'RT (khusus Pengurus RT)', value: u.rt || '', max: 10, placeholder: 'RT01' }].concat(u.username ? [{ name: 'aktif', label: 'Akun aktif', type: 'checkbox', value: u.aktif !== 'Tidak' }] : []);
  root.innerHTML = judul('Pengguna pengurus', 'Akun untuk Pengurus Paguyuban, Pengurus RT, dan Dewan Pengawas. Satu orang, satu akun.', '<button class="btn pri" id="ugBaru">Tambah pengguna</button>') +
    tableHTML([{ h: 'Nama pengguna', k: 'username' }, { h: 'Nama', k: 'nama' }, { h: 'Peran', f: (r) => esc(PERAN[r.role] || r.role) + (r.rt ? ' ' + esc(r.rt) : '') }, { h: 'Jabatan', k: 'jabatan' }, { h: 'Status', f: (r) => (r.aktif === 'Ya' ? '<span class="chip good"><span aria-hidden="true">✓</span>Aktif</span>' : '<span class="chip">Nonaktif</span>') + (r.wajib_ganti_pin === 'Ya' ? ' <span class="chip warn">PIN awal</span>' : '') }, { h: '', f: (r) => '<div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-ub="' + esc(r.username) + '">Ubah</button><button class="btn sm" data-rp="' + esc(r.username) + '">Reset PIN</button></div>' }], l, { empty: 'Belum ada pengguna.' });
  $('#ugBaru', root).onclick = () => formModal({ title: 'Tambah pengguna', fields: form({}), onSubmit: async (v) => { const r = await api('userSimpan', { data: v }); V.pengguna(root); pinPenggunaModal(r.username, r.pin, 'Pengguna ditambahkan'); return false; } });
  $$('[data-ub]', root).forEach((b) => { b.onclick = () => { const u = l.filter((x) => x.username === b.getAttribute('data-ub'))[0]; formModal({ title: 'Ubah ' + u.username, fields: form(u).filter((f) => f.name !== 'username'), onSubmit: async (v) => { await api('userSimpan', { data: Object.assign({ username: u.username }, v) }); toast('Disimpan.', 'good'); V.pengguna(root); } }); }; });
  $$('[data-rp]', root).forEach((b) => { b.onclick = async () => { const u = b.getAttribute('data-rp'); if (await konfirmasi('Reset PIN', 'Buat PIN sementara baru untuk ' + u + '?', 'Reset PIN')) { const r = await coba(() => api('userResetPin', { username: u })); if (r) { V.pengguna(root); pinPenggunaModal(u, r.pin, 'PIN baru'); } } }; });
};

  ['NAMA_PAGUYUBAN', 'Nama paguyuban', 'text'], ['ALAMAT', 'Alamat sekretariat', 'text'], ['TAHUN_ANGGARAN', 'Tahun anggaran berjalan', 'number'],
  ['TARIF_IPL_DEFAULT', 'Tarif IPL standar per KK per bulan (Rp)', 'number'], ['JATUH_TEMPO_TGL', 'Tanggal jatuh tempo tiap bulan (1-28)', 'number'],
  ['SALDO_AWAL', 'Saldo kas awal saat mulai memakai sistem (Rp)', 'number', 'Jangan diubah setelah transaksi berjalan.'],
  ['REKENING_INFO', 'Info rekening pembayaran (tampil di portal warga)', 'text'], ['KONTAK_BENDAHARA', 'Kontak Bendahara', 'text'],
  ['BATAS_T1_PERSEN', 'Batas Tingkat 1 (% dari total RAPB)', 'number'], ['BATAS_T2_PERSEN', 'Batas Tingkat 2 (%)', 'number'], ['BATAS_T3_PERSEN', 'Batas Tingkat 3 (%)', 'number'],
  ['MIN_PENAWARAN', 'Minimal jumlah penawaran (Tingkat 2 ke atas)', 'number'], ['TOLERANSI_NILAI_FINAL', 'Toleransi nilai beli terhadap perkiraan (%)', 'number'],
  ['DANA_RT_DASAR_PERSEN', 'Dana RT: porsi dibagi rata (%)', 'number'], ['DANA_RT_PROP_PERSEN', 'Dana RT: porsi menurut jumlah KK (%)', 'number', 'Bersama porsi dibagi rata harus berjumlah 100.'],
  ['TAMPILKAN_VENDOR', 'Tampilkan nama penerima/penyedia di halaman publik', 'select']
];
V.pengaturan = async (root) => {
  const c = await api('pengaturanGet', {});
  const fs = PENGATURAN_INFO.map((p) => ({ name: p[0], label: p[1], type: p[2] === 'select' ? 'select' : (p[2] === 'number' ? 'number' : 'text'), options: ['Ya', 'Tidak'], value: c[p[0]], help: p[3], max: 300 }));
  root.innerHTML = judul('Pengaturan') + '<div class="card" style="max-width:640px">' + fieldsHTML(fs) + '<div class="err hide" id="pgErr"></div><div style="margin-top:16px"><button class="btn pri" id="pgSimpan">Simpan pengaturan</button></div></div>';
  $('#pgSimpan', root).onclick = async () => {
    const v = readForm(root, fs);
    try { await api('pengaturanSimpan', { values: v }); PUB = null; DASHT = 0; toast('Pengaturan disimpan.', 'good'); } catch (e) { const er = $('#pgErr', root); er.textContent = e.message; er.classList.remove('hide'); }
  };
};

V.audit = async (root) => {
  const l = await api('auditList', {});
  root.innerHTML = judul('Jejak audit', '300 aktivitas terakhir. Semua perubahan data tercatat siapa, kapan, dan apa. PIN tidak pernah dicatat.') +
    tableHTML([{ h: 'Waktu', cls: 'nw', k: 'waktu' }, { h: 'Pelaku', k: 'pelaku' }, { h: 'Aksi', k: 'aksi' }, { h: 'Rincian', k: 'detail' }], l, { empty: 'Belum ada aktivitas.' });
};

/* Turbo: data yang dibutuhkan tiap menu (harus sama persis dengan panggilan di masing-masing halaman) */
const PREF = {
  beranda: () => [['dashboardStaf', {}]],
  pembayaran: () => [['tagihanStatus', { periode: PB.periode || hariIniLokal().slice(0, 7) }], ['tunggakanList', {}]],
  konfirmasi: () => [['konfirmasiList', { status: KF_STATUS }]],
  kk: () => [['kkList', {}]],
  rapb: () => [['rapbList', RB.tahun ? { tahun: RB.tahun } : {}], ['posList', {}]],
  pengadaan: () => [['pengadaanList', PG_ST ? { status: PG_ST } : {}], ['posList', {}]],
  pengeluaran: () => [['keluarList', {}], ['posList', {}], ['rapbList', {}]],
  lain: () => [['pendapatanLainList', {}], ['posList', {}]],
  danart: () => [['danaRTList', DR_TAHUN ? { tahun: DR_TAHUN } : {}]],
  lpj: () => [['lpjList', {}]],
  pengumuman: () => [['pengumumanList', {}]],
  laporan: () => [['laporanPratinjau', { periode: LP_PER || (() => { const t = hariIniLokal(), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7)); return m === 1 ? (y - 1) + '-12' : y + '-' + ('0' + (m - 1)).slice(-2); })() }], ['publicData', {}]],
  pemeriksaan: () => [['publicData', {}]],
  pengguna: () => [['userList', {}]],
  pengaturan: () => [['pengaturanGet', {}]],
  audit: () => [['auditList', {}]]
};

/* ================================================================
   ROUTER & INISIALISASI
   ================================================================ */
function route() {
  const seg = location.hash.replace(/^#\/?/, '').split('/');
  if (API_URL.indexOf('GANTI_') === 0) {
    $('#app').innerHTML = '<div class="card loginbox" style="max-width:560px"><h2>Halaman belum terhubung ke Google Sheets</h2><p class="t2">Buka berkas <b>index.html</b>, cari baris <code>const API_URL</code> (sekitar baris 213), lalu ganti dengan URL Web App Apps Script Anda (berakhiran <code>/exec</code>). Ikuti panduan pemasangan langkah 6.</p></div>';
    return;
  }
  if ((seg[0] === 'staf' || seg[0] === 'warga') && !PUB) muatPublik().catch(() => { /* nama tetap default */ });
  if (seg[0] === 'staf') tampilStaf(seg[1]);
  else if (seg[0] === 'warga') tampilWarga();
  else tampilPublik(seg[0] || '');
}
window.addEventListener('hashchange', () => { closeModal(); window.scrollTo(0, 0); route(); });
renderAkun();
route();
</script>
